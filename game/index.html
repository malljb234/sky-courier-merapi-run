<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merapi Vector (Elang-7) — 3D Tactical Flight Simulator</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b2a3a; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Merapi Vector (Elang-7), 3D tactical flight simulator. Steer the bush plane with arrows or WASD, work the throttle with Shift and Control, and fly the sorties of Operation Merapi Vector."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
